<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>CopyGuard</title>
  <style>
    body { width: 280px; font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 16px; }
    .logo { font-size: 16px; font-weight: 700; color: #818cf8; margin-bottom: 4px; }
    .sub { font-size: 11px; color: #64748b; margin-bottom: 12px; }
    .row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; font-size: 13px; }
    .label { color: #94a3b8; }
    .badge { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 12px; }
    .on { background: rgba(34,197,94,.15); color: #4ade80; }
    .off { background: rgba(239,68,68,.15); color: #f87171; }
    .divider { height: 1px; background: #1e293b; margin: 8px 0; }
    .blocked { color: #4ade80; }
    .disabled { color: #94a3b8; }
    .name-input { width: 100%; padding: 10px 12px; border: 1px solid #334155; border-radius: 8px; background: #1e293b; color: #e2e8f0; font-size: 14px; outline: none; margin-bottom: 10px; }
    .name-input:focus { border-color: #6366f1; }
    .btn { width: 100%; padding: 10px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .btn-primary { background: linear-gradient(135deg, #6366f1, #7c3aed); color: white; }
    .toggle-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; }
    .toggle-label { font-size: 14px; font-weight: 600; color: #e2e8f0; }
    .toggle { position: relative; width: 44px; height: 24px; cursor: pointer; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; background: #334155; border-radius: 24px; transition: 0.3s; }
    .slider:before { content: ""; position: absolute; height: 18px; width: 18px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: 0.3s; }
    .toggle input:checked + .slider { background: #6366f1; }
    .toggle input:checked + .slider:before { transform: translateX(20px); }
  </style>
</head>
<body>
  <div class="logo">🛡️ CopyGuard</div>
  <div class="sub">Copy/Paste Protection</div>

  <!-- NAME INPUT — visible by default -->
  <div id="name-section">
    <p style="font-size:14px; color:#94a3b8; margin-bottom:8px;">Welcome! Enter your name to get started:</p>
    <input type="text" id="name-input" class="name-input" placeholder="Your name" maxlength="30" />
    <button id="save-name-btn" class="btn btn-primary">Start</button>
  </div>

  <!-- MAIN STATUS — hidden until name is saved -->
  <div id="main-section" style="display:none;">
    <div class="row" style="margin-bottom:4px;">
      <span class="label">Name</span>
      <span id="user-name" style="font-size:13px; font-weight:600; color:#818cf8;"></span>
    </div>
    <div class="divider"></div>
    <div class="toggle-row">
      <span class="toggle-label" id="toggle-label">Protection ON</span>
      <label class="toggle">
        <input type="checkbox" id="enabled-toggle" checked />
        <span class="slider"></span>
      </label>
    </div>
    <div class="divider"></div>
    <div class="row">
      <span class="label">Connection</span>
      <span id="conn" class="badge off">Checking...</span>
    </div>
    <div class="divider"></div>
    <div class="row"><span class="label">Copy</span><span id="copy-state" class="blocked">Blocked</span></div>
    <div class="row"><span class="label">Cut</span><span id="cut-state" class="blocked">Blocked</span></div>
    <div class="row"><span class="label">Paste</span><span id="paste-state" class="blocked">Blocked</span></div>
  </div>

  <script>
  document.addEventListener("DOMContentLoaded", function () {
    var nameSection = document.getElementById("name-section");
    var mainSection = document.getElementById("main-section");
    var nameInput = document.getElementById("name-input");
    var saveNameBtn = document.getElementById("save-name-btn");
    var userNameEl = document.getElementById("user-name");
    var toggle = document.getElementById("enabled-toggle");
    var toggleLabel = document.getElementById("toggle-label");
    var connEl = document.getElementById("conn");
    var copyState = document.getElementById("copy-state");
    var cutState = document.getElementById("cut-state");
    var pasteState = document.getElementById("paste-state");

    // Check if name already saved
    chrome.storage.local.get(["user_name", "protection_enabled"], function (result) {
      if (result.user_name) {
        nameSection.style.display = "none";
        mainSection.style.display = "block";
        userNameEl.textContent = result.user_name;
        toggle.checked = result.protection_enabled !== false;
        updateUI(toggle.checked);
      }
    });

    // Save name button
    saveNameBtn.addEventListener("click", function () {
      var name = nameInput.value.trim();
      if (!name) {
        nameInput.style.borderColor = "#f87171";
        nameInput.focus();
        return;
      }
      chrome.storage.local.set({ user_name: name, protection_enabled: true }, function () {
        nameSection.style.display = "none";
        mainSection.style.display = "block";
        userNameEl.textContent = name;
        toggle.checked = true;
        updateUI(true);
        chrome.runtime.sendMessage({ type: "name_set", name: name });
      });
    });

    // Enter key saves name
    nameInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        saveNameBtn.click();
      }
    });

    // Toggle handler
    toggle.addEventListener("change", function () {
      var enabled = toggle.checked;
      chrome.storage.local.set({ protection_enabled: enabled });
      updateUI(enabled);
      chrome.tabs.query({}, function (tabs) {
        tabs.forEach(function (tab) {
          if (!tab.url || tab.url.indexOf("chrome://") === 0) return;
          chrome.tabs.sendMessage(tab.id, { type: "toggle_protection", enabled: enabled }).catch(function(){});
        });
      });
      chrome.runtime.sendMessage({ type: "toggle", enabled: enabled });
    });

    function updateUI(enabled) {
      if (enabled) {
        toggleLabel.textContent = "Protection ON";
        toggleLabel.style.color = "#4ade80";
        copyState.textContent = "Blocked"; copyState.className = "blocked";
        cutState.textContent = "Blocked"; cutState.className = "blocked";
        pasteState.textContent = "Blocked"; pasteState.className = "blocked";
      } else {
        toggleLabel.textContent = "Protection OFF";
        toggleLabel.style.color = "#f87171";
        copyState.textContent = "Allowed"; copyState.className = "disabled";
        cutState.textContent = "Allowed"; cutState.className = "disabled";
        pasteState.textContent = "Allowed"; pasteState.className = "disabled";
      }
    }

    // Connection status
    chrome.runtime.sendMessage({ type: "get_status" }, function (status) {
      if (status && status.connected) {
        connEl.textContent = "🟢 Connected";
        connEl.className = "badge on";
      } else {
        connEl.textContent = "🔴 Disconnected";
        connEl.className = "badge off";
      }
    });
  });
  </script>
</body>
</html>
