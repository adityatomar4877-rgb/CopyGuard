<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>CopyGuard</title>
  <style>
    body { width: 240px; font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 16px; }
    .logo { font-size: 16px; font-weight: 700; color: #818cf8; margin-bottom: 12px; }
    .row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; }
    .label { color: #94a3b8; }
    .badge { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 12px; }
    .on { background: rgba(34,197,94,.15); color: #4ade80; }
    .off { background: rgba(239,68,68,.15); color: #f87171; }
    .divider { height: 1px; background: #1e293b; margin: 8px 0; }
    .blocked { color: #4ade80; }
  </style>
</head>
<body>
  <div class="logo">🛡️ CopyGuard</div>
  <div class="row">
    <span class="label">Connection</span>
    <span id="conn" class="badge off">Checking...</span>
  </div>
  <div class="divider"></div>
  <div class="row"><span class="label">Copy</span><span class="blocked">Blocked</span></div>
  <div class="row"><span class="label">Cut</span><span class="blocked">Blocked</span></div>
  <div class="row"><span class="label">Paste</span><span class="blocked">Blocked</span></div>
  <script src="popup.js"></script>
</body>
</html>
