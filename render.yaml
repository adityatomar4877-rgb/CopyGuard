# Render Blueprint for CopyGuard backend
# This file tells Render how to deploy the backend automatically.
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: copyguard-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.6"
